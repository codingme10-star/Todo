### كود HTML
أضف هذا الكود في المكان الذي تريده داخل صفحتك:

```html
<div class="app-container">
  <!-- حاوية الساعة والمؤقت -->
  <div class="time-widgets-container">
    
    <!-- قسم الساعة -->
    <div class="widget">
      <h3>الساعة الآن</h3>
      <div id="clock-display" class="fancy-numbers">00:00:00</div>
    </div>

    <!-- قسم المؤقت -->
    <div class="widget">
      <h3>المؤقت</h3>
      <div id="timer-display" class="fancy-numbers">00:00</div>
      <div class="timer-controls">
        <input type="number" id="timer-input" placeholder="دقائق" min="1">
        <button onclick="startTimer()">ابدأ</button>
      </div>
    </div>
    
  </div>

  <!-- خانة إضافة المهام (أسفل الساعة والمؤقت) -->
  <div class="task-input-container">
    <input type="text" id="task-input" placeholder="أضف مهمة جديدة...">
    <button id="add-task-btn">إضافة</button>
  </div>
</div>
